services:
  scanner:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
